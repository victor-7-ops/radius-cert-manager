{% extends "base.html" %}
{% block title %}Issue certificate — Certificate Manager{% endblock %}
{% block content %}
<a href="/certs" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-900 mb-4">
  <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M17 10a.75.75 0 0 1-.75.75H5.612l4.158 3.96a.75.75 0 1 1-1.04 1.08l-5.5-5.25a.75.75 0 0 1 0-1.08l5.5-5.25a.75.75 0 1 1 1.04 1.08L5.612 9.25H16.25A.75.75 0 0 1 17 10Z" clip-rule="evenodd"/></svg>
  Certificates
</a>
<h1 class="text-2xl font-semibold text-slate-900 tracking-tight mb-6">Issue certificate</h1>

<div class="max-w-md card p-6">
  {% if error %}
  <div role="alert" class="mb-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2.5">
    {{ error }}
  </div>
  {% endif %}
  <form method="post" action="/certs/issue" class="space-y-4"
        onsubmit="const b=this.querySelector('button'); b.disabled=true; b.innerText='Issuing…';">
    <input type="hidden" name="request_id" value="{{ request_id }}">
    <div>
      <label for="cn" class="field-label">Identifier (CN)</label>
      <input id="cn" name="cn" type="text" required autofocus
             hx-get="/certs/check-cn" hx-trigger="input changed delay:300ms" hx-target="#cn-status" hx-swap="innerHTML"
             class="field-input">
      <div id="cn-status" class="mt-1.5 text-sm"></div>
    </div>
    <div>
      <label for="note" class="field-label">Note (optional)</label>
      <input id="note" name="note" type="text" class="field-input">
    </div>
    <button type="submit" class="btn-primary w-full">
      <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 0 1 1 1v5h5a1 1 0 1 1 0 2h-5v5a1 1 0 1 1-2 0v-5H4a1 1 0 1 1 0-2h5V4a1 1 0 0 1 1-1Z" clip-rule="evenodd"/></svg>
      Issue certificate
    </button>
  </form>
</div>
{% endblock %}

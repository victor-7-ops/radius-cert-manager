{% extends "base.html" %}
{% block title %}Issue certificate — Certificate Manager{% endblock %}
{% block content %}
<h1 class="text-lg font-semibold text-slate-900 mb-4">Issue certificate</h1>

<div class="max-w-md bg-white border border-slate-200 rounded-lg p-6">
  {% if error %}
  <div role="alert" class="mb-4 text-sm text-red-700 bg-red-50 border border-red-200 rounded px-3 py-2">
    {{ error }}
  </div>
  {% endif %}
  <form method="post" action="/certs/issue" class="space-y-4"
        onsubmit="const b=this.querySelector('button'); b.disabled=true; b.innerText='Issuing…';">
    <input type="hidden" name="request_id" value="{{ request_id }}">
    <div>
      <label for="cn" class="block text-sm font-medium text-slate-700 mb-1">Identifier (CN)</label>
      <input id="cn" name="cn" type="text" required autofocus
             hx-get="/certs/check-cn" hx-trigger="input changed delay:300ms" hx-target="#cn-status" hx-swap="innerHTML"
             class="w-full min-h-[44px] rounded border border-slate-300 px-3 focus:outline-none focus:ring-2 focus:ring-slate-500">
      <div id="cn-status" class="mt-1 text-sm"></div>
    </div>
    <div>
      <label for="note" class="block text-sm font-medium text-slate-700 mb-1">Note (optional)</label>
      <input id="note" name="note" type="text"
             class="w-full min-h-[44px] rounded border border-slate-300 px-3 focus:outline-none focus:ring-2 focus:ring-slate-500">
    </div>
    <button type="submit"
            class="w-full min-h-[44px] rounded bg-slate-900 text-white font-medium hover:bg-slate-800 disabled:opacity-50">
      Issue certificate
    </button>
  </form>
</div>
{% endblock %}

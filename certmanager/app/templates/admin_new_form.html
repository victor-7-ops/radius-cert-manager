<form hx-post="/admins" hx-target="#new-admin-slot" hx-swap="innerHTML"
      class="card p-5 space-y-4 max-w-sm">
  <div>
    <label class="field-label">Username</label>
    <input name="username" required class="field-input">
  </div>
  <div>
    <label class="field-label">Role</label>
    <select name="role" class="field-input">
      <option value="admin">Admin</option>
      <option value="super_admin">Super Admin</option>
    </select>
  </div>
  <button type="submit" class="btn-primary w-full">
    Create (temporary password shown once)
  </button>
</form>

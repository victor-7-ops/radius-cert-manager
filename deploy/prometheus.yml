global:
  scrape_interval: 30s

rule_files:
  - /etc/prometheus/rules/radius-alerts.yml

scrape_configs:
  - job_name: certmanager
    metrics_path: /metrics
    scheme: https
    tls_config:
      insecure_skip_verify: true   # self-signed web.crt, internal docker network only
    static_configs:
      - targets: ["certmanager:8443"]

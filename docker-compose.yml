services:
  certmanager:
    build:
      context: .
      args:
        # Set by the caller: GIT_SHA=$(git rev-parse HEAD) docker compose build
        # Defaults to "unknown" so a plain `docker compose build` (sha not
        # exported) builds an image that visibly says so at /health, instead
        # of looking current while running stale code (R1, 26 Nov 2026).
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: certmanager
    extra_hosts:
      - "topline-freeradius1:192.168.13.54"
    restart: unless-stopped
    env_file: .env
    security_opt:
      - no-new-privileges:true
    ports:
      - "8443:8443"   # direct LAN access until certmanager.topline.ph DNS/port-forward exist
    volumes:
      - /srv/data/certmanager:/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.certmanager.rule=Host(`topline-hub.duckdns.org`)"
      - "traefik.http.routers.certmanager.entrypoints=websecure"
      - "traefik.http.routers.certmanager.tls.certresolver=le"
      - "traefik.http.services.certmanager.loadbalancer.server.port=8443"
    networks:
      - web
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: certmanager-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-alerts.yml:/etc/prometheus/rules/radius-alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # localhost only -- no auth on Prometheus's own UI/API
    networks:
      - web
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.3"

networks:
  web:
    external: true

volumes:
  prometheus-data:

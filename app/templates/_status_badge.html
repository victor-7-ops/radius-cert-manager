{% macro status_badge(status) %}
  {% if status == "active" %}
  <span class="badge badge-green">
    <span class="w-1.5 h-1.5 rounded-full bg-green-600 dark:bg-green-400"></span> Active
  </span>
  {% elif status == "suspended" %}
  <span class="badge badge-amber">
    <span class="w-1.5 h-1.5 rounded-full bg-amber-600 dark:bg-amber-400"></span> Suspended
  </span>
  {% elif status == "revoked" %}
  <span class="badge badge-red">
    <span class="w-1.5 h-1.5 rounded-full bg-red-600 dark:bg-red-400"></span> Revoked
  </span>
  {% else %}
  <span class="badge badge-slate">
    <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span> Expired
  </span>
  {% endif %}
{% endmacro %}

[pytest]
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Both come from pinned third-party code (starlette 0.41.3 via
    # fastapi 0.115.6, pytest-asyncio 0.25.0), not this app — bumping
    # either is a separate, larger change (fastapi alone is 26 minor
    # versions behind). Filtered by exact message so any *new*
    # DeprecationWarning — including one this app's own code causes —
    # still surfaces instead of getting lost in ~22k lines of noise.
    ignore:'asyncio.iscoroutinefunction' is deprecated and slated for removal in Python 3\.16; use inspect\.iscoroutinefunction\(\) instead:DeprecationWarning
    ignore:'asyncio.get_event_loop_policy' is deprecated and slated for removal in Python 3\.16:DeprecationWarning
